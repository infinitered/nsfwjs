[build]
  base = "/"
  command = "npm run build && cd examples/nsfw_demo && npm i && npm run build"
  publish = "examples/nsfw_demo/dist"
  edge_functions = "examples/nsfw_demo/netlify/edge-functions"

[build.environment]
NODE_VERSION = "22.13.0"

# Vite emits content-hashed filenames under /assets, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
